spring.application.name=counter
server.port=8080

# H2 file DB so the value survives restarts (use jdbc:h2:mem:counterdb for throwaway)
spring.datasource.url=jdbc:h2:file:./data/counterdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate manages the schema in dev; use Flyway/Liquibase + "validate" in prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Allowed frontend origin (CORS)
app.cors.allowed-origins=http://localhost:5173
